name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'

      - name: Clean & Re-create Android Setup
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.example.max_assistant --project-name max_assistant

      - name: Force Kotlin 1.9.22, Min SDK 21 & Fixed Manifest Permissions
        run: |
          python3 - << 'EOF'
          import os, re

          # 1. Update settings.gradle
          s_file = 'android/settings.gradle'
          if os.path.exists(s_file):
              with open(s_file, 'r') as f:
                  txt = f.read()
              txt = re.sub(r'org\.jetbrains\.kotlin\.android.*version\s+["\'][^"\']+["\']', 'org.jetbrains.kotlin.android" version "1.9.22"', txt)
              with open(s_file, 'w') as f:
                  f.write(txt)

          # 2. Update build.gradle
          b_file = 'android/build.gradle'
          if os.path.exists(b_file):
              with open(b_file, 'r') as f:
                  txt = f.read()
              if 'ext.kotlin_version' in txt:
                  txt = re.sub(r'ext\.kotlin_version\s*=\s*["\'][^"\']+["\']', "ext.kotlin_version = '1.9.22'", txt)
              else:
                  txt = "buildscript {\n    ext.kotlin_version = '1.9.22'\n}\n" + txt
              with open(b_file, 'w') as f:
                  f.write(txt)

          # 3. App build.gradle (Min SDK 21)
          app_b_file = 'android/app/build.gradle'
          if os.path.exists(app_b_file):
              with open(app_b_file, 'r') as f:
                  txt = f.read()
              txt = re.sub(r'minSdkVersion\s+.*', 'minSdkVersion 21', txt)
              txt = re.sub(r'flutter\.minSdkVersion', '21', txt)
              with open(app_b_file, 'w') as f:
                  f.write(txt)

          # 4. Correctly insert Permissions into AndroidManifest.xml before <application>
          m_file = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(m_file):
              with open(m_file, 'r') as f:
                  txt = f.read()
              
              perms = '''
      <uses-permission android:name="android.permission.RECORD_AUDIO"/>
      <uses-permission android:name="android.permission.INTERNET"/>
      <uses-permission android:name="android.permission.BLUETOOTH"/>
      <uses-permission android:name="android.permission.BLUETOOTH_ADMIN"/>
      <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>
  '''
              if '<application' in txt:
                  txt = txt.replace('<application', perms + '\n    <application')
              
              with open(m_file, 'w') as f:
                  f.write(txt)

          print("Permissions and Gradle configurations fixed cleanly.")
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Max-AI-Assistant
          path: build/app/outputs/flutter-apk/app-release.apk
