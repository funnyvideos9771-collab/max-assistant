name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Recreate Android project
        run: |
          rm -rf android
          flutter create --platforms=android --project-name max_app .

      - name: Write pubspec.yaml (fixed versions)
        run: |
          rm -f pubspec.lock
          cat > pubspec.yaml <<'EOF'
          name: max_app
          description: MAX voice assistant
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.4.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            speech_to_text: ^7.0.0
            flutter_tts: ^4.2.0
            flutter_contacts: ^1.1.9
            torch_light: ^1.1.0
            android_intent_plus: ^5.3.0
            http: ^1.2.2
            shared_preferences: ^2.3.2
            image_picker: ^1.1.2
            path_provider: ^2.1.4
            permission_handler: ^11.3.1
            url_launcher: ^6.3.0
            audioplayers: ^6.1.0
          flutter:
            uses-material-design: true
          EOF

      - name: Add permissions and device admin receiver
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          perms = '''
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.FLASHLIGHT"/>
              <uses-permission android:name="android.permission.READ_CONTACTS"/>
              <uses-permission android:name="android.permission.CALL_PHONE"/>
              <uses-permission android:name="android.permission.READ_PHONE_STATE"/>
              <uses-permission android:name="android.permission.SET_ALARM"/>
              <uses-permission android:name="android.permission.SEND_SMS"/>
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/>
              <queries>
                  <intent><action android:name="android.intent.action.TTS_SERVICE"/></intent>
                  <intent><action android:name="android.speech.RecognitionService"/></intent>
                  <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent>
                  <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="whatsapp"/></intent>
                  <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="tel"/></intent>
                  <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="sms"/></intent>
                  <intent><action android:name="android.intent.action.DIAL"/><data android:scheme="tel"/></intent>
                  <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="google.navigation"/></intent>
                  <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="vnd.youtube"/></intent>
              </queries>
          '''
          s = s.replace('<application', perms + '<application', 1)
          rec = '''
              <receiver android:name=".AdminReceiver" android:permission="android.permission.BIND_DEVICE_ADMIN" android:exported="true">
                  <meta-data android:name="android.app.device_admin" android:resource="@xml/device_admin"/>
                  <intent-filter><action android:name="android.app.action.DEVICE_ADMIN_ENABLED"/></intent-filter>
              </receiver>
          </application>'''
          s = s.replace('</application>', rec, 1)
          open(p, 'w').write(s)
          PY
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/device_admin.xml <<'EOF'
          <device-admin xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-policies>
              <force-lock/>
              <watch-login/>
            </uses-policies>
          </device-admin>
          EOF

      - name: Add native lock and intruder alert code
        run: |
          MA=$(find android/app/src/main -name 'MainActivity.*' | head -n 1)
          D=$(dirname "$MA")
          PKGLINE=$(grep -m1 '^package' "$MA" | tr -d '\r')
          rm -f "$MA"
          cat > "$D/MainActivity.kt" <<EOF
          $PKGLINE

          import android.app.admin.DevicePolicyManager
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
            override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
              super.configureFlutterEngine(flutterEngine)
              MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "max/native").setMethodCallHandler { call, result ->
                val dpm = getSystemService(Context.DEVICE_POLICY_SERVICE) as DevicePolicyManager
                val cn = ComponentName(this, AdminReceiver::class.java)
                when (call.method) {
                  "isAdmin" -> result.success(dpm.isAdminActive(cn))
                  "requestAdmin" -> {
                    val i = Intent(DevicePolicyManager.ACTION_ADD_DEVICE_ADMIN)
                    i.putExtra(DevicePolicyManager.EXTRA_DEVICE_ADMIN, cn)
                    i.putExtra(DevicePolicyManager.EXTRA_ADD_EXPLANATION, "MAX ko phone lock aur intruder alert ke liye chahiye")
                    startActivity(i)
                    result.success(true)
                  }
                  "lock" -> {
                    if (dpm.isAdminActive(cn)) { dpm.lockNow(); result.success(true) } else result.success(false)
                  }
                  else -> result.notImplemented()
                }
              }
            }
          }
          EOF
          cat > "$D/AdminReceiver.kt" <<EOF
          $PKGLINE

          import android.app.admin.DeviceAdminReceiver
          import android.app.admin.DevicePolicyManager
          import android.content.Context
          import android.content.Intent
          import android.telephony.SmsManager
          import java.net.URL
          import java.net.URLEncoder
          import java.text.SimpleDateFormat
          import java.util.Date
          import kotlin.concurrent.thread

          class AdminReceiver : DeviceAdminReceiver() {
            companion object { var last = 0L }
            override fun onPasswordFailed(context: Context, intent: Intent) {
              val now = System.currentTimeMillis()
              if (now - last < 60000) return
              last = now
              val pr = goAsync()
              thread {
                try {
                  val sp = context.getSharedPreferences("FlutterSharedPreferences", Context.MODE_PRIVATE)
                  val phone = sp.getString("flutter.alert_phone", "8700176034") ?: "8700176034"
                  val dpm = context.getSystemService(Context.DEVICE_POLICY_SERVICE) as DevicePolicyManager
                  val n = dpm.currentFailedPasswordAttempts
                  val t = SimpleDateFormat("dd MMM yyyy HH:mm:ss").format(Date())
                  val msg = "MAX ALERT: Aapke phone ko kisi ne unlock karne ki koshish ki. Galat attempts: " + n + ". Time: " + t
                  val enc = URLEncoder.encode(msg, "UTF-8")
                  val cmb = sp.getString("flutter.cmb_key", "") ?: ""
                  if (cmb.isNotEmpty()) try {
                    URL("https://api.callmebot.com/whatsapp.php?phone=91" + phone + "&text=" + enc + "&apikey=" + cmb).readText()
                  } catch (e: Exception) {}
                  val tok = sp.getString("flutter.tg_token", "") ?: ""
                  val cid = sp.getString("flutter.tg_chat", "") ?: ""
                  if (tok.isNotEmpty() && cid.isNotEmpty()) try {
                    URL("https://api.telegram.org/bot" + tok + "/sendMessage?chat_id=" + cid + "&text=" + enc).readText()
                  } catch (e: Exception) {}
                  try {
                    val sm = if (android.os.Build.VERSION.SDK_INT >= 31) context.getSystemService(SmsManager::class.java) else SmsManager.getDefault()
                    sm.sendTextMessage("+91" + phone, null, msg, null, null)
                  } catch (e: Exception) {}
                } finally { pr.finish() }
              }
            }
          }
          EOF

      - name: Set minSdk 24
        run: |
          f=$(ls android/app/build.gradle* | head -n 1)
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' "$f"

      - name: Get packages
        run: flutter pub get

      - name: Check Dart errors
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | grep -E "error" || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: max-apk
          if-no-files-found: error
          path: build/app/outputs/flutter-apk/app-release.apk
