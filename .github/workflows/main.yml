name: Build MYRA APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate fresh android project
        run: |
          rm -rf android
          flutter create --platforms=android --org com.myra --project-name max_assistant .

      - name: Set minSdk 24 and compileSdk 36
        run: |
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' "$f"
              sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' "$f"
              sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' "$f"
              sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' "$f"
              grep -n "minSdk\|compileSdk" "$f"
            fi
          done

      - name: Force compileSdk 36 on all plugins
        run: |
          if [ -f android/build.gradle.kts ]; then
            cat >> android/build.gradle.kts <<'EOF'

          subprojects {
              afterEvaluate {
                  val android = extensions.findByName("android")
                  if (android is com.android.build.gradle.BaseExtension) {
                      android.compileSdkVersion(36)
                  }
              }
          }
          EOF
          else
            cat >> android/build.gradle <<'EOF'

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      project.android.compileSdkVersion 36
                  }
              }
          }
          EOF
          fi
          tail -15 android/build.gradle*

      - name: Add Android permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i \
              <uses-permission android:name="android.permission.INTERNET"/>\
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>\
              <uses-permission android:name="android.permission.CAMERA"/>\
              <uses-permission android:name="android.permission.VIBRATE"/>\
              <uses-permission android:name="android.permission.WAKE_LOCK"/>\
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\
              <queries><intent><action android:name="android.speech.RecognitionService"/></intent><intent><action android:name="android.intent.action.TTS_SERVICE"/></intent><intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent></queries>' $MANIFEST

      - run: flutter pub get

      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release --no-tree-shake-icons 2>&1 | tee build.log

      - name: Show the real error
        if: failure()
        run: |
          grep -n -A25 "What went wrong" build.log | head -60

      - uses: actions/upload-artifact@v4
        with:
          name: myra-apk
          path: build/app/outputs/flutter-apk/app-release.apk
