name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'

      - name: Clean & Re-create Android Setup
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.example.max_assistant --project-name max_assistant

      - name: Configure Android Permissions and Gradle
        run: |
          python3 - << 'EOF'
          import os, re

          # 1. Update settings.gradle
          s_file = 'android/settings.gradle'
          if os.path.exists(s_file):
              with open(s_file, 'r') as f:
                  txt = f.read()
              txt = re.sub(r'org\.jetbrains\.kotlin\.android.*version\s+["\'][^"\']+["\']', 'org.jetbrains.kotlin.android" version "1.9.22"', txt)
              with open(s_file, 'w') as f:
                  f.write(txt)

          # 2. Update build.gradle
          b_file = 'android/build.gradle'
          if os.path.exists(b_file):
              with open(b_file, 'r') as f:
                  txt = f.read()
              if 'ext.kotlin_version' in txt:
                  txt = re.sub(r'ext\.kotlin_version\s*=\s*["\'][^"\']+["\']', "ext.kotlin_version = '1.9.22'", txt)
              else:
                  txt = "buildscript {\n    ext.kotlin_version = '1.9.22'\n}\n" + txt
              with open(b_file, 'w') as f:
                  f.write(txt)

          # 3. Update app/build.gradle (minSdkVersion 21)
          app_b_file = 'android/app/build.gradle'
          if os.path.exists(app_b_file):
              with open(app_b_file, 'r') as f:
                  txt = f.read()
              txt = re.sub(r'minSdkVersion\s+.*', 'minSdkVersion 21', txt)
              txt = re.sub(r'flutter\.minSdkVersion', '21', txt)
              with open(app_b_file, 'w') as f:
                  f.write(txt)

          # 4. Write clean AndroidManifest.xml with Microphone Permissions
          manifest_content = '''<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <uses-permission android:name="android.permission.RECORD_AUDIO"/>
    <uses-permission android:name="android.permission.INTERNET"/>
    <uses-permission android:name="android.permission.BLUETOOTH"/>
    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN"/>
    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>

    <application
        android:label="max_assistant"
        android:name="${applicationName}"
        android:icon="@mipmap/ic_launcher">
        <activity
            android:name=".MainActivity"
            android:exported="true"
            android:launchMode="singleTop"
            android:theme="@style/LaunchTheme"
            android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
            android:hardwareAccelerated="true"
            android:windowSoftInputMode="adjustResize">
            <meta-data
              android:name="io.flutter.embedding.android.NormalTheme"
              android:resource="@style/NormalTheme"
              />
            <intent-filter>
                <action android:name="android.intent.action.MAIN"/>
                <category android:name="android.intent.category.LAUNCHER"/>
            </intent-filter>
        </activity>
        <meta-data
            android:name="flutterEmbedding"
            android:value="2" />
    </application>
</manifest>
'''
          m_file = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(m_file):
              with open(m_file, 'w') as f:
                  f.write(manifest_content)

          print("Configuration and Manifest updated successfully.")
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Max-AI-Assistant
          path: build/app/outputs/flutter-apk/app-release.apk
