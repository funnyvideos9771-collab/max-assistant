name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'

      - name: Clean & Re-create Android Setup
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.example.max_assistant --project-name max_assistant

      - name: Update Kotlin Version
        run: |
          sed -i 's/1.8.22/1.9.22/g' android/settings.gradle 2>/dev/null || true
          sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "1.9.22"/g' android/build.gradle 2>/dev/null || true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Max-AI-Assistant
          path: build/app/outputs/flutter-apk/app-release.apk
