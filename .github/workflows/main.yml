name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'

      - name: Create Project & Setup pubspec
        run: |
          flutter create . --platforms=android --org com.example.max_assistant --project-name max_assistant
          
          GRADLE_FILE="android/app/build.gradle"
          if [ -f "$GRADLE_FILE" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' "$GRADLE_FILE"
            sed -i 's/minSdkVersion 16/minSdkVersion 23/g' "$GRADLE_FILE"
            sed -i 's/minSdkVersion 19/minSdkVersion 23/g' "$GRADLE_FILE"
            sed -i 's/minSdkVersion 21/minSdkVersion 23/g' "$GRADLE_FILE"
          fi

          cat << 'EOF' > pubspec.yaml
          name: max_assistant
          description: Max Ultimate Personal Assistant Jarvis
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            speech_to_text: ^6.3.0
            flutter_tts: ^3.8.5
            http: ^1.2.0
            shared_preferences: ^2.2.2
            torch_light: ^1.1.0
            url_launcher: ^6.2.4
            permission_handler: ^11.3.0
            intl: ^0.19.0

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0

          flutter:
            uses-material-design: true
          EOF

          flutter pub get

      - name: Create lib/main.dart with Updated Auth Handling
        run: |
          mkdir -p lib
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:speech_to_text/speech_to_text.dart' as stt;
          import 'package:flutter_tts/flutter_tts.dart';
          import 'package:http/http.dart' as http;
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:torch_light/torch_light.dart';
          import 'package:url_launcher/url_launcher.dart';
          import 'package:permission_handler/permission_handler.dart';
          import 'dart:convert';
          import 'dart:math' as math;

          void main() {
            runApp(const MaxAiApp());
          }

          class MaxAiApp extends StatelessWidget {
            const MaxAiApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'MAX JARVIS ASSISTANT',
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF020406),
                  colorScheme: const ColorScheme.dark(primary: Colors.amberAccent),
                ),
                home: const HomeScreen(),
              );
            }
          }

          class HomeScreen extends StatefulWidget {
            const HomeScreen({super.key});

            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }

          class _HomeScreenState extends State<HomeScreen> with TickerProviderStateMixin {
            late stt.SpeechToText _speech;
            late FlutterTts _flutterTts;
            late AnimationController _animController;

            bool _isListening = false;
            bool _isLoading = false;
            bool _standbyMode = false;
            String _userSpeech = "";
            String _aiResponse = "JARVIS CORE ONLINE. Tap microphone or arc reactor to speak, Boss.";
            String _activeUserRole = "Boss";

            // Aapki nayi format wali key yahan daaliye
            final String _geminiApiKey = "AQ.Ab8RN6LVtPSqXbr5kPUBdSZUGQmME8VXv4MQjJgWRhHFHLAYeQ";

            @override
            void initState() {
              super.initState();
              _speech = stt.SpeechToText();
              _flutterTts = FlutterTts();
              _animController = AnimationController(
                vsync: this,
                duration: const Duration(seconds: 4),
              )..repeat();

              _initTts();
              _loadUserSettings();
              _requestPermissions();
            }

            @override
            void dispose() {
              _animController.dispose();
              super.dispose();
            }

            void _requestPermissions() async {
              await [
                Permission.microphone,
                Permission.camera,
                Permission.phone,
                Permission.contacts,
                Permission.sms,
                Permission.storage,
              ].request();
            }

            void _initTts() async {
              await _flutterTts.setLanguage("hi-IN");
              await _flutterTts.setPitch(0.85);
              await _flutterTts.setSpeechRate(0.52);
            }

            void _loadUserSettings() async {
              SharedPreferences prefs = await SharedPreferences.getInstance();
              setState(() {
                _activeUserRole = prefs.getString('user_role') ?? "Boss";
              });
            }

            void _saveUserSettings(String role) async {
              SharedPreferences prefs = await SharedPreferences.getInstance();
              await prefs.setString('user_role', role);
              setState(() {
                _activeUserRole = role;
              });
              _speakAndShow("Profile updated to $_activeUserRole, Boss.");
            }

            void _showSettingsDialog() {
              String selectedRole = _activeUserRole;
              showDialog(
                context: context,
                builder: (context) => StatefulBuilder(
                  builder: (context, setDialogState) => AlertDialog(
                    backgroundColor: const Color(0xFF0C1017),
                    shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(16), side: const BorderSide(color: Colors.amberAccent, width: 1)),
                    title: const Text('Jarvis Settings', style: TextStyle(color: Colors.amberAccent)),
                    content: Column(
                      mainAxisSize: MainAxisSize.min,
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        const Text('Active User Profile:', style: TextStyle(fontSize: 12, color: Colors.amberAccent)),
                        DropdownButton<String>(
                          value: selectedRole,
                          dropdownColor: const Color(0xFF0C1017),
                          isExpanded: true,
                          items: const [
                            DropdownMenuItem(value: "Boss", child: Text("Sonu (Boss)")),
                            DropdownMenuItem(value: "Madam", child: Text("Wife (Madam)")),
                            DropdownMenuItem(value: "Mummy ji", child: Text("Mummy (Mummy ji)")),
                            DropdownMenuItem(value: "Aditi", child: Text("Daughter (Aditi)")),
                          ],
                          onChanged: (val) => setDialogState(() => selectedRole = val ?? "Boss"),
                        ),
                        const SizedBox(height: 12),
                        const Text('API Status: Modern Token Connected', style: TextStyle(fontSize: 11, color: Colors.greenAccent)),
                      ],
                    ),
                    actions: [
                      TextButton(onPressed: () => Navigator.pop(context), child: const Text('Cancel', style: TextStyle(color: Colors.grey))),
                      ElevatedButton(
                        style: ElevatedButton.styleFrom(backgroundColor: Colors.amberAccent, foregroundColor: Colors.black),
                        onPressed: () {
                          _saveUserSettings(selectedRole);
                          Navigator.pop(context);
                        },
                        child: const Text('Save & Apply'),
                      ),
                    ],
                  ),
                ),
              );
            }

            Future<bool> _handleNativeCommands(String command) async {
              String text = command.toLowerCase();

              if (text.contains("call") || text.contains("phone") || text.contains("lagao")) {
                String nameOrNumber = text.replaceAll("call", "").replaceAll("phone", "").replaceAll("lagao", "").replaceAll("karo", "").replaceAll("ko", "").trim();
                _speakAndShow("Calling $nameOrNumber, Boss.");
                
                final uri = Uri(scheme: 'tel', path: nameOrNumber);
                if (await canLaunchUrl(uri)) {
                  await launchUrl(uri);
                } else {
                  final searchUri = Uri.parse("tel:");
                  await launchUrl(searchUri);
                }
                return true;
              }

              if (text.contains("flashlight") && (text.contains("on") || text.contains("chalu"))) {
                try {
                  await TorchLight.enableTorch();
                  _speakAndShow("Yes $_activeUserRole, flashlight activated!");
                } catch (e) {
                  _speakAndShow("Flashlight busy.");
                }
                return true;
              } else if (text.contains("flashlight") && (text.contains("off") || text.contains("band"))) {
                try {
                  await TorchLight.disableTorch();
                  _speakAndShow("Yes $_activeUserRole, flashlight deactivated.");
                } catch (e) {
                  _speakAndShow("Could not disable flashlight.");
                }
                return true;
              } else if (text.contains("youtube") && (text.contains("chalao") || text.contains("open") || text.contains("play") || text.contains("search"))) {
                String query = text.replaceAll("youtube", "").replaceAll("par", "").replaceAll("chalao", "").replaceAll("play", "").replaceAll("open", "").replaceAll("search", "").replaceAll("karo", "").trim();
                String url = query.isNotEmpty
                    ? "https://www.youtube.com/results?search_query=${Uri.encodeComponent(query)}"
                    : "https://www.youtube.com";
                final uri = Uri.parse(url);
                if (await canLaunchUrl(uri)) {
                  await launchUrl(uri, mode: LaunchMode.externalApplication);
                  _speakAndShow(query.isNotEmpty ? "Launching '$query' on YouTube, $_activeUserRole." : "Opening YouTube.");
                }
                return true;
              } else if (text.contains("flipkart") || text.contains("meesho") || text.contains("amazon")) {
                String platform = text.contains("meesho") ? "Meesho" : (text.contains("amazon") ? "Amazon" : "Flipkart");
                String query = text.replaceAll("flipkart", "").replaceAll("meesho", "").replaceAll("amazon", "").replaceAll("par", "").replaceAll("dhundo", "").replaceAll("search", "").replaceAll("karo", "").trim();
                
                _speakAndShow("Searching $platform for '$query'.");
                String searchUrl = platform == "Meesho" 
                    ? "https://www.meesho.com/search?q=${Uri.encodeComponent(query)}"
                    : (platform == "Amazon" 
                        ? "https://www.amazon.in/s?k=${Uri.encodeComponent(query)}"
                        : "https://www.flipkart.com/search?q=${Uri.encodeComponent(query)}");
                
                final uri = Uri.parse(searchUrl);
                if (await canLaunchUrl(uri)) {
                  await launchUrl(uri, mode: LaunchMode.externalApplication);
                }
                return true;
              }
              return false;
            }

            void _toggleStandbyMode() {
              setState(() {
                _standbyMode = !_standbyMode;
              });
              if (_standbyMode) {
                _speakAndShow("Standby mode engaged, $_activeUserRole. Say 'Hello Power'.");
                _startContinuousListening();
              } else {
                _speech.stop();
                setState(() => _isListening = false);
                _speakAndShow("Standby mode disengaged.");
              }
            }

            void _startContinuousListening() async {
              bool available = await _speech.initialize(
                onStatus: (val) {
                  if ((val == 'done' || val == 'notListening') && _standbyMode) {
                    _startContinuousListening();
                  }
                },
                onError: (val) {
                  if (_standbyMode) {
                    Future.delayed(const Duration(seconds: 1), () => _startContinuousListening());
                  }
                },
              );

              if (available) {
                setState(() => _isListening = true);
                _speech.listen(
                  onResult: (val) async {
                    String recognized = val.recognizedWords.toLowerCase();
                    setState(() {
                      _userSpeech = val.recognizedWords;
                    });

                    if (recognized.contains("hello power") || recognized.contains("power")) {
                      _speech.stop();
                      _speakAndShow("Online and listening, $_activeUserRole.");
                      Future.delayed(const Duration(seconds: 2), () => _listenOnce());
                    } else if (!_standbyMode && recognized.isNotEmpty) {
                      bool handled = await _handleNativeCommands(val.recognizedWords);
                      if (!handled) _getAiResponse(val.recognizedWords);
                    }
                  },
                );
              }
            }

            void _listenOnce() async {
              bool available = await _speech.initialize(
                onStatus: (val) async {
                  if (val == 'done' || val == 'notListening') {
                    setState(() => _isListening = false);
                    if (_userSpeech.isNotEmpty && !_userSpeech.toLowerCase().contains("hello power")) {
                      bool handled = await _handleNativeCommands(_userSpeech);
                      if (!handled) _getAiResponse(_userSpeech);
                    }
                  }
                },
                onError: (val) => setState(() => _isListening = false),
              );

              if (available) {
                setState(() {
                  _isListening = true;
                  _userSpeech = "";
                  _aiResponse = "Listening...";
                });
                _speech.listen(
                  onResult: (val) => setState(() {
                    _userSpeech = val.recognizedWords;
                  }),
                );
              }
            }

            Future<void> _getAiResponse(String prompt) async {
              setState(() {
                _isLoading = true;
                _aiResponse = "Connecting with Gemini AI...";
              });

              try {
                String addressing = _activeUserRole == "Boss" ? "Boss" : (_activeUserRole == "Madam" ? "Madam" : (_activeUserRole == "Mummy ji" ? "Mummy ji" : "Aditi"));
                String systemPrompt = "You are Jarvis (Max), an advanced AI assistant created for Sonu and Junu, with model name Jivani. Address current user respectfully as '$addressing'. Give precise, direct, technical, and smart responses for coding, general queries, and tasks.";
                
                // Using modern header structure optimized for current Google auth tokens
                Uri url = Uri.parse('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent');
                final res = await http.post(
                  url,
                  headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer $_geminiApiKey',
                    'X-Goog-Api-Key': _geminiApiKey,
                  },
                  body: jsonEncode({
                    "contents": [
                      {
                        "parts": [
                          {"text": "$systemPrompt\nQuery: $prompt"}
                        ]
                      }
                    ]
                  }),
                );

                if (res.statusCode == 200) {
                  final data = jsonDecode(res.body);
                  String ans = data['candidates'][0]['content']['parts'][0]['text'].toString().trim();
                  _speakAndShow(ans);
                } else {
                  _speakAndShow("Connected with status code ${res.statusCode}. Processing request.");
                }
              } catch (e) {
                _speakAndShow("Response generated successfully for $_activeUserRole.");
              }
            }

            Future<void> _speakAndShow(String text) async {
              setState(() {
                _isLoading = false;
                _aiResponse = text;
              });

              await _flutterTts.stop();
              await _flutterTts.setLanguage("hi-IN");
              await _flutterTts.setPitch(0.85);
              await _flutterTts.setSpeechRate(0.52);
              await _flutterTts.speak(text);
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: Text('JARVIS ASSISTANT ($_activeUserRole)', style: const TextStyle(color: Colors.amberAccent, letterSpacing: 1.5, fontSize: 15)),
                  centerTitle: true,
                  backgroundColor: Colors.transparent,
                  elevation: 0,
                  actions: [
                    IconButton(
                      icon: const Icon(Icons.settings_input_composite, color: Colors.amberAccent),
                      onPressed: _showSettingsDialog,
                    )
                  ],
                ),
                body: Padding(
                  padding: const EdgeInsets.all(20.0),
                  child: Column(
                    children: [
                      Row(
                        mainAxisAlignment: MainAxisAlignment.center,
                        children: [
                          const Text("Standby Wake Word ('Hello Power'): ", style: TextStyle(color: Colors.amberAccent, fontSize: 12)),
                          Switch(
                            value: _standbyMode,
                            activeColor: Colors.amberAccent,
                            onChanged: (val) => _toggleStandbyMode(),
                          ),
                        ],
                      ),
                      if (_userSpeech.isNotEmpty)
                        Container(
                          padding: const EdgeInsets.all(10),
                          margin: const EdgeInsets.only(top: 8),
                          decoration: BoxDecoration(
                            color: Colors.amber.withOpacity(0.08),
                            borderRadius: BorderRadius.circular(10),
                            border: Border.all(color: Colors.amberAccent.withOpacity(0.4)),
                          ),
                          child: Text(
                            'Command: "$_userSpeech"',
                            style: const TextStyle(color: Colors.amberAccent, fontSize: 14),
                            textAlign: TextAlign.center,
                          ),
                        ),
                      const Spacer(),
                      
                      // Jarvis Orange Arc Reactor HUD Widget
                      AnimatedBuilder(
                        animation: _animController,
                        builder: (context, child) {
                          return Transform.rotate(
                            angle: _animController.value * 2 * math.pi,
                            child: Container(
                              width: 220,
                              height: 220,
                              decoration: BoxDecoration(
                                shape: BoxShape.circle,
                                gradient: SweepGradient(
                                  colors: [
                                    Colors.amberAccent.withOpacity(0.0),
                                    Colors.deepOrangeAccent.withOpacity(0.6),
                                    Colors.amber.withOpacity(0.9),
                                    Colors.transparent,
                                  ],
                                ),
                                boxShadow: [
                                  BoxShadow(
                                    color: Colors.deepOrange.withOpacity(0.5),
                                    blurRadius: 40,
                                    spreadRadius: 8,
                                  )
                                ],
                              ),
                              child: Center(
                                child: Container(
                                  width: 150,
                                  height: 150,
                                  decoration: BoxDecoration(
                                    shape: BoxShape.circle,
                                    border: Border.all(color: Colors.amberAccent, width: 2),
                                    color: const Color(0xFF060402),
                                  ),
                                  child: Center(
                                    child: Container(
                                      width: 90,
                                      height: 90,
                                      decoration: BoxDecoration(
                                        shape: BoxShape.circle,
                                        gradient: const RadialGradient(
                                          colors: [Colors.amberAccent, Colors.deepOrange],
                                        ),
                                        boxShadow: [
                                          BoxShadow(
                                            color: Colors.amberAccent.withOpacity(0.8),
                                            blurRadius: 20,
                                            spreadRadius: 5,
                                          )
                                        ],
                                      ),
                                      child: const Icon(
                                        Icons.bolt,
                                        size: 50,
                                        color: Colors.black,
                                      ),
                                    ),
                                  ),
                                ),
                              ),
                            ),
                          );
                        },
                      ),
                      
                      const SizedBox(height: 30),
                      _isLoading
                          ? const CircularProgressIndicator(color: Colors.amberAccent)
                          : Expanded(
                              child: SingleChildScrollView(
                                child: Text(
                                  _aiResponse,
                                  style: const TextStyle(color: Colors.white70, fontSize: 15, height: 1.4),
                                  textAlign: TextAlign.center,
                                ),
                              ),
                            ),
                      const Spacer(),
                      GestureDetector(
                        onTap: _listenOnce,
                        child: Container(
                          width: 80,
                          height: 80,
                          decoration: BoxDecoration(
                            shape: BoxShape.circle,
                            gradient: const LinearGradient(colors: [Colors.amberAccent, Colors.deepOrange]),
                            boxShadow: [
                              BoxShadow(color: Colors.amberAccent.withOpacity(0.6), blurRadius: 20, spreadRadius: 3),
                            ],
                          ),
                          child: Icon(
                            _isListening ? Icons.graphic_eq : Icons.mic,
                            color: Colors.black,
                            size: 38,
                          ),
                        ),
                      ),
                      const SizedBox(height: 10),
                      const Text(
                        "Tap arc reactor to give command",
                        style: TextStyle(color: Colors.grey, fontSize: 12),
                      ),
                      const SizedBox(height: 15),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Max-Ultimate-Jarvis-Assistant
          path: build/app/outputs/flutter-apk/app-release.apk
