name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'

      - name: Re-create Clean Flutter Project
        run: |
          rm -rf android lib pubspec.yaml
          flutter create . --platforms=android --org com.example.max_assistant --project-name max_assistant
          flutter pub add speech_to_text flutter_tts http shared_preferences torch_light url_launcher permission_handler

      - name: Fix Android SDK Versions Properly
        run: |
          APP_GRADLE="android/app/build.gradle"
          python3 -c "
          with open('$APP_GRADLE', 'r') as f:
              content = f.read()

          # Replace compileSdkVersion, targetSdkVersion, minSdkVersion cleanly
          content = content.replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdkVersion 34')
          content = content.replace('targetSdkVersion flutter.targetSdkVersion', 'targetSdkVersion 34')
          content = content.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 21')
          
          # In case they are written with numbers already
          if 'minSdkVersion 16' in content:
              content = content.replace('minSdkVersion 16', 'minSdkVersion 21')
          if 'minSdkVersion 19' in content:
              content = content.replace('minSdkVersion 19', 'minSdkVersion 21')

          with open('$APP_GRADLE', 'w') as f:
              f.write(content)
          print('Successfully updated build.gradle SDK versions!')
          "

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            PERMS='<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.CALL_PHONE" />'
            awk -v p="$PERMS" '/<application/{print p}1' $MANIFEST > $MANIFEST.tmp && mv $MANIFEST.tmp $MANIFEST
          fi

      - name: Create lib/main.dart Code
        run: |
          mkdir -p lib
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:speech_to_text/speech_to_text.dart' as stt;
          import 'package:flutter_tts/flutter_tts.dart';
          import 'package:http/http.dart' as http;
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:torch_light/torch_light.dart';
          import 'package:url_launcher/url_launcher.dart';
          import 'package:permission_handler/permission_handler.dart';
          import 'dart:convert';
          import 'dart:math' as math;

          void main() {
            runApp(const MaxAiApp());
          }

          class MaxAiApp extends StatelessWidget {
            const MaxAiApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'Max AI Jarvis Assistant',
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF070B19),
                  colorScheme: const ColorScheme.dark(primary: Colors.cyanAccent),
                ),
                home: const HomeScreen(),
              );
            }
          }

          class HomeScreen extends StatefulWidget {
            const HomeScreen({super.key});

            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }

          class _HomeScreenState extends State<HomeScreen> with TickerProviderStateMixin {
            late stt.SpeechToText _speech;
            late FlutterTts _flutterTts;
            late AnimationController _animController;

            bool _isListening = false;
            bool _isLoading = false;
            bool _standbyMode = false;
            String _userSpeech = "";
            String _aiResponse = "Tap mic or say 'Hello Power' in Standby Mode!";

            String _selectedProvider = "Gemini";
            String _geminiKey = "";
            String _chatgptKey = "";
            String _claudeKey = "";
            String _elevenLabsKey = "";

            final String _aiContextMemory = "Your name is Max, a smart voice assistant. User's name is Sonu. Sonu's best friend is Junu. Speak short, friendly Hindi/Hinglish answers.";

            @override
            void initState() {
              super.initState();
              _speech = stt.SpeechToText();
              _flutterTts = FlutterTts();
              _animController = AnimationController(
                vsync: this,
                duration: const Duration(seconds: 2),
              )..repeat();

              _initTts();
              _loadApiSettings();
              _requestPermissions();
            }

            @override
            void dispose() {
              _animController.dispose();
              super.dispose();
            }

            void _requestPermissions() async {
              await [
                Permission.microphone,
                Permission.camera,
                Permission.phone,
              ].request();
            }

            void _initTts() async {
              await _flutterTts.setLanguage("hi-IN");
              await _flutterTts.setPitch(1.0);
              await _flutterTts.setSpeechRate(0.5);
            }

            void _loadApiSettings() async {
              SharedPreferences prefs = await SharedPreferences.getInstance();
              setState(() {
                _selectedProvider = prefs.getString('selected_provider') ?? "Gemini";
                _geminiKey = prefs.getString('gemini_api_key') ?? "";
                _chatgptKey = prefs.getString('chatgpt_api_key') ?? "";
                _claudeKey = prefs.getString('claude_api_key') ?? "";
                _elevenLabsKey = prefs.getString('elevenlabs_api_key') ?? "";
              });
            }

            void _saveApiSettings(String provider, String gKey, String cKey, String clKey, String eKey) async {
              SharedPreferences prefs = await SharedPreferences.getInstance();
              await prefs.setString('selected_provider', provider);
              await prefs.setString('gemini_api_key', gKey);
              await prefs.setString('chatgpt_api_key', cKey);
              await prefs.setString('claude_api_key', clKey);
              await prefs.setString('elevenlabs_api_key', eKey);
              setState(() {
                _selectedProvider = provider;
                _geminiKey = gKey;
                _chatgptKey = cKey;
                _claudeKey = clKey;
                _elevenLabsKey = eKey;
              });
            }

            void _showSettingsDialog() {
              String tempProvider = _selectedProvider;
              TextEditingController gController = TextEditingController(text: _geminiKey);
              TextEditingController cController = TextEditingController(text: _chatgptKey);
              TextEditingController clController = TextEditingController(text: _claudeKey);
              TextEditingController eController = TextEditingController(text: _elevenLabsKey);

              showDialog(
                context: context,
                builder: (context) => StatefulBuilder(
                  builder: (context, setDialogState) {
                    return AlertDialog(
                      backgroundColor: const Color(0xFF1E293B),
                      title: const Text('AI & Voice Settings'),
                      content: SingleChildScrollView(
                        child: Column(
                          mainAxisSize: MainAxisSize.min,
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            const Text('Active AI Engine:', style: TextStyle(color: Colors.cyanAccent)),
                            DropdownButton<String>(
                              value: tempProvider,
                              isExpanded: true,
                              dropdownColor: const Color(0xFF0F172A),
                              items: ['Gemini', 'ChatGPT', 'Claude']
                                  .map((e) => DropdownMenuItem(value: e, child: Text(e)))
                                  .toList(),
                              onChanged: (val) {
                                if (val != null) {
                                  setDialogState(() => tempProvider = val);
                                }
                              },
                            ),
                            const SizedBox(height: 12),
                            const Text('Gemini API Key:', style: TextStyle(fontSize: 12, color: Colors.grey)),
                            TextField(controller: gController, decoration: const InputDecoration(hintText: 'Paste Gemini Key', isDense: true)),
                            const SizedBox(height: 10),
                            const Text('ChatGPT API Key:', style: TextStyle(fontSize: 12, color: Colors.grey)),
                            TextField(controller: cController, decoration: const InputDecoration(hintText: 'Paste OpenAI Key', isDense: true)),
                            const SizedBox(height: 10),
                            const Text('Claude API Key:', style: TextStyle(fontSize: 12, color: Colors.grey)),
                            TextField(controller: clController, decoration: const InputDecoration(hintText: 'Paste Claude Key', isDense: true)),
                            const SizedBox(height: 10),
                            const Text('ElevenLabs API Key (Real Voice):', style: TextStyle(fontSize: 12, color: Colors.grey)),
                            TextField(controller: eController, decoration: const InputDecoration(hintText: 'ElevenLabs Voice Key', isDense: true)),
                          ],
                        ),
                      ),
                      actions: [
                        TextButton(onPressed: () => Navigator.pop(context), child: const Text('Cancel')),
                        ElevatedButton(
                          onPressed: () {
                            _saveApiSettings(tempProvider, gController.text.trim(), cController.text.trim(), clController.text.trim(), eController.text.trim());
                            Navigator.pop(context);
                          },
                          child: const Text('Save Settings'),
                        ),
                      ],
                    );
                  },
                ),
              );
            }

            Future<bool> _handleNativeCommands(String command) async {
              String text = command.toLowerCase();

              if (text.contains("flashlight turn on") || text.contains("flashlight on") || text.contains("torch on")) {
                try {
                  await TorchLight.enableTorch();
                  _speakAndShow("Flashlight chalu kar di hai Sonu ji!");
                } catch (e) {
                  _speakAndShow("Flashlight enable nahi ho saki.");
                }
                return true;
              } else if (text.contains("flashlight turn off") || text.contains("flashlight off") || text.contains("torch off")) {
                try {
                  await TorchLight.disableTorch();
                  _speakAndShow("Flashlight band kar di hai!");
                } catch (e) {
                  _speakAndShow("Flashlight disable nahi ho saki.");
                }
                return true;
              } else if (text.contains("youtube") && (text.contains("chalao") || text.contains("open") || text.contains("play"))) {
                String query = text.replaceAll("youtube", "").replaceAll("par", "").replaceAll("funny videos", "funny videos").replaceAll("chalao", "").replaceAll("play", "").replaceAll("open", "").trim();
                String url = query.isNotEmpty
                    ? "https://www.youtube.com/results?search_query=${Uri.encodeComponent(query)}"
                    : "https://www.youtube.com";
                final uri = Uri.parse(url);
                if (await canLaunchUrl(uri)) {
                  await launchUrl(uri, mode: LaunchMode.externalApplication);
                  _speakAndShow("YouTube open kar raha hu!");
                }
                return true;
              } else if (text.contains("call") || text.contains("phone karo")) {
                if (text.contains("junu")) {
                  final uri = Uri.parse("tel:");
                  await launchUrl(uri);
                  _speakAndShow("Junu ko call dialer open kar diya hai!");
                } else {
                  final uri = Uri.parse("tel:");
                  await launchUrl(uri);
                  _speakAndShow("Dialer open kar diya hai!");
                }
                return true;
              }
              return false;
            }

            void _toggleStandbyMode() {
              setState(() {
                _standbyMode = !_standbyMode;
              });
              if (_standbyMode) {
                _speakAndShow("Standby mode ON! Aab 'Hello Power' boliye.");
                _startContinuousListening();
              } else {
                _speech.stop();
                setState(() => _isListening = false);
                _speakAndShow("Standby mode OFF.");
              }
            }

            void _startContinuousListening() async {
              bool available = await _speech.initialize(
                onStatus: (val) {
                  if ((val == 'done' || val == 'notListening') && _standbyMode) {
                    _startContinuousListening();
                  }
                },
                onError: (val) {
                  if (_standbyMode) {
                    Future.delayed(const Duration(seconds: 1), () => _startContinuousListening());
                  }
                },
              );

              if (available) {
                setState(() => _isListening = true);
                _speech.listen(
                  onResult: (val) async {
                    String recognized = val.recognizedWords.toLowerCase();
                    setState(() {
                      _userSpeech = val.recognizedWords;
                    });

                    if (recognized.contains("hello power") || recognized.contains("power")) {
                      _speech.stop();
                      _speakAndShow("Haan Sonu ji, main sun raha hu! Kya madad karu?");
                      Future.delayed(const Duration(seconds: 2), () => _listenOnce());
                    } else if (!_standbyMode && recognized.isNotEmpty) {
                      bool handled = await _handleNativeCommands(val.recognizedWords);
                      if (!handled) _getAiResponse(val.recognizedWords);
                    }
                  },
                );
              }
            }

            void _listenOnce() async {
              bool available = await _speech.initialize(
                onStatus: (val) async {
                  if (val == 'done' || val == 'notListening') {
                    setState(() => _isListening = false);
                    if (_userSpeech.isNotEmpty && !_userSpeech.toLowerCase().contains("hello power")) {
                      bool handled = await _handleNativeCommands(_userSpeech);
                      if (!handled) _getAiResponse(_userSpeech);
                    }
                  }
                },
                onError: (val) => setState(() => _isListening = false),
              );

              if (available) {
                setState(() {
                  _isListening = true;
                  _userSpeech = "";
                  _aiResponse = "Listening... Bolna shuru karein";
                });
                _speech.listen(
                  onResult: (val) => setState(() {
                    _userSpeech = val.recognizedWords;
                  }),
                );
              }
            }

            Future<void> _getAiResponse(String prompt) async {
              setState(() {
                _isLoading = true;
                _aiResponse = "Soch raha hu ($_selectedProvider)...";
              });

              String fullPrompt = "$_aiContextMemory\nUser Question: $prompt";

              try {
                if (_selectedProvider == "Gemini") {
                  if (_geminiKey.isEmpty) {
                    _speakAndShow("Settings (⚙️) me Gemini API Key daalein.");
                    return;
                  }
                  final url = Uri.parse('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$_geminiKey');
                  final res = await http.post(
                    url,
                    headers: {'Content-Type': 'application/json'},
                    body: jsonEncode({
                      "contents": [
                        {"parts": [{"text": fullPrompt}]}
                      ]
                    }),
                  );
                  if (res.statusCode == 200) {
                    final data = jsonDecode(res.body);
                    _speakAndShow(data['candidates'][0]['content']['parts'][0]['text'].toString().trim());
                  } else {
                    _speakAndShow("Gemini API Error. Key check karein.");
                  }
                } else if (_selectedProvider == "ChatGPT") {
                  if (_chatgptKey.isEmpty) {
                    _speakAndShow("Settings (⚙️) me ChatGPT API Key daalein.");
                    return;
                  }
                  final url = Uri.parse('https://api.openai.com/v1/chat/completions');
                  final res = await http.post(
                    url,
                    headers: {
                      'Content-Type': 'application/json',
                      'Authorization': 'Bearer $_chatgptKey'
                    },
                    body: jsonEncode({
                      "model": "gpt-3.5-turbo",
                      "messages": [
                        {"role": "user", "content": fullPrompt}
                      ]
                    }),
                  );
                  if (res.statusCode == 200) {
                    final data = jsonDecode(res.body);
                    _speakAndShow(data['choices'][0]['message']['content'].toString().trim());
                  } else {
                    _speakAndShow("ChatGPT API Error. Key check karein.");
                  }
                } else if (_selectedProvider == "Claude") {
                  if (_claudeKey.isEmpty) {
                    _speakAndShow("Settings (⚙️) me Claude API Key daalein.");
                    return;
                  }
                  final url = Uri.parse('https://api.anthropic.com/v1/messages');
                  final res = await http.post(
                    url,
                    headers: {
                      'Content-Type': 'application/json',
                      'x-api-key': _claudeKey,
                      'anthropic-version': '2023-06-01'
                    },
                    body: jsonEncode({
                      "model": "claude-3-haiku-20240307",
                      "max_tokens": 300,
                      "messages": [
                        {"role": "user", "content": fullPrompt}
                      ]
                    }),
                  );
                  if (res.statusCode == 200) {
                    final data = jsonDecode(res.body);
                    _speakAndShow(data['content'][0]['text'].toString().trim());
                  } else {
                    _speakAndShow("Claude API Error. Key check karein.");
                  }
                }
              } catch (e) {
                _speakAndShow("Internet connection error.");
              }
            }

            void _speakAndShow(String text) async {
              setState(() {
                _isLoading = false;
                _aiResponse = text;
              });
              await _flutterTts.stop();
              await _flutterTts.speak(text);
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: Text('MAX JARVIS ($_selectedProvider)'),
                  centerTitle: true,
                  backgroundColor: Colors.transparent,
                  elevation: 0,
                  actions: [
                    IconButton(
                      icon: const Icon(Icons.settings, color: Colors.cyanAccent),
                      onPressed: _showSettingsDialog,
                    )
                  ],
                ),
                body: Padding(
                  padding: const EdgeInsets.all(24.0),
                  child: Column(
                    children: [
                      Row(
                        mainAxisAlignment: MainAxisAlignment.center,
                        children: [
                          const Text("Wake Word ('Hello Power'): "),
                          Switch(
                            value: _standbyMode,
                            activeColor: Colors.cyanAccent,
                            onChanged: (val) => _toggleStandbyMode(),
                          ),
                        ],
                      ),
                      if (_userSpeech.isNotEmpty)
                        Container(
                          padding: const EdgeInsets.all(12),
                          margin: const EdgeInsets.only(top: 8),
                          decoration: BoxDecoration(
                            color: Colors.cyan.withOpacity(0.1),
                            borderRadius: BorderRadius.circular(12),
                            border: Border.all(color: Colors.cyanAccent.withOpacity(0.3)),
                          ),
                          child: Text(
                            'Aapne Kaha: "$_userSpeech"',
                            style: const TextStyle(color: Colors.cyanAccent, fontSize: 16),
                            textAlign: TextAlign.center,
                          ),
                        ),
                      const Spacer(),
                      
                      // Animated Jarvis Glowing Visualizer
                      AnimatedBuilder(
                        animation: _animController,
                        builder: (context, child) {
                          double scale = 1.0 + math.sin(_animController.value * 2 * math.pi) * 0.1;
                          return Transform.scale(
                            scale: _isListening ? scale * 1.15 : scale,
                            child: Container(
                              width: 170,
                              height: 170,
                              decoration: BoxDecoration(
                                shape: BoxShape.circle,
                                gradient: RadialGradient(
                                  colors: _isListening
                                      ? [Colors.redAccent.withOpacity(0.8), Colors.deepOrange.withOpacity(0.2), Colors.transparent]
                                      : [Colors.cyanAccent.withOpacity(0.8), Colors.blue.withOpacity(0.2), Colors.transparent],
                                ),
                                boxShadow: [
                                  BoxShadow(
                                    color: _isListening ? Colors.redAccent.withOpacity(0.6) : Colors.cyanAccent.withOpacity(0.6),
                                    blurRadius: _isListening ? 35 : 25,
                                    spreadRadius: 5,
                                  )
                                ],
                              ),
                              child: Center(
                                child: Container(
                                  width: 110,
                                  height: 110,
                                  decoration: BoxDecoration(
                                    shape: BoxShape.circle,
                                    color: const Color(0xFF0F172A),
                                    border: Border.all(
                                      color: _isListening ? Colors.redAccent : Colors.cyanAccent,
                                      width: 2.5,
                                    ),
                                  ),
                                  child: Icon(
                                    _isListening ? Icons.graphic_eq : Icons.psychology,
                                    size: 50,
                                    color: _isListening ? Colors.redAccent : Colors.cyanAccent,
                                  ),
                                ),
                              ),
                            ),
                          );
                        },
                      ),
                      
                      const SizedBox(height: 35),
                      _isLoading
                          ? const CircularProgressIndicator(color: Colors.cyanAccent)
                          : SingleChildScrollView(
                              child: Text(
                                _aiResponse,
                                style: const TextStyle(color: Colors.white, fontSize: 17, fontWeight: FontWeight.w500),
                                textAlign: TextAlign.center,
                              ),
                            ),
                      const Spacer(),
                      GestureDetector(
                        onTap: _listenOnce,
                        child: CircleAvatar(
                          radius: 40,
                          backgroundColor: _isListening ? Colors.redAccent : Colors.cyanAccent,
                          child: Icon(
                            _isListening ? Icons.stop : Icons.mic,
                            color: Colors.black,
                            size: 38,
                          ),
                        ),
                      ),
                      const SizedBox(height: 12),
                      Text(
                        _isListening ? "Listening..." : "Tap mic or say 'Hello Power'",
                        style: const TextStyle(color: Colors.grey, fontSize: 14),
                      ),
                      const SizedBox(height: 20),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Max-AI-Assistant
          path: build/app/outputs/flutter-apk/app-release.apk
