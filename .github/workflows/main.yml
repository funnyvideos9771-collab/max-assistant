name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'

      - name: Re-create Clean Flutter Project
        run: |
          rm -rf android lib
          flutter create . --platforms=android --org com.example.max_assistant --project-name max_assistant
          flutter pub add speech_to_text flutter_tts http shared_preferences

      - name: Configure Android Permissions and Gradle
        run: |
          python3 -c "
          import os, re

          # 1. Update settings.gradle (Kotlin 1.9.22)
          s_file = 'android/settings.gradle'
          if os.path.exists(s_file):
              with open(s_file, 'r') as f:
                  txt = f.read()
              txt = re.sub(r'org\.jetbrains\.kotlin\.android.*version\s+[\"'][^\"']+[\"']', 'org.jetbrains.kotlin.android\" version \"1.9.22\"', txt)
              with open(s_file, 'w') as f:
                  f.write(txt)

          # 2. Update build.gradle
          b_file = 'android/build.gradle'
          if os.path.exists(b_file):
              with open(b_file, 'r') as f:
                  txt = f.read()
              if 'ext.kotlin_version' in txt:
                  txt = re.sub(r'ext\.kotlin_version\s*=\s*[\"'][^\"']+[\"']', \"ext.kotlin_version = '1.9.22'\", txt)
              else:
                  txt = \"buildscript {\n    ext.kotlin_version = '1.9.22'\n}\n\" + txt
              with open(b_file, 'w') as f:
                  f.write(txt)

          # 3. Update app/build.gradle
          app_b_file = 'android/app/build.gradle'
          if os.path.exists(app_b_file):
              with open(app_b_file, 'r') as f:
                  txt = f.read()
              txt = re.sub(r'minSdkVersion\s+.*', 'minSdkVersion 21', txt)
              txt = re.sub(r'flutter\.minSdkVersion', '21', txt)
              with open(app_b_file, 'w') as f:
                  f.write(txt)

          # 4. Inject Permissions
          m_file = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(m_file):
              with open(m_file, 'r') as f:
                  txt = f.read()
              if 'RECORD_AUDIO' not in txt:
                  perms = '<uses-permission android:name=\"android.permission.RECORD_AUDIO\" />\n<uses-permission android:name=\"android.permission.INTERNET\" />\n<uses-permission android:name=\"android.permission.WAKE_LOCK\" />\n<uses-permission android:name=\"android.permission.FOREGROUND_SERVICE\" />\n'
                  txt = txt.replace('<application', perms + '<application')
                  with open(m_file, 'w') as f:
                      f.write(txt)
          "

      - name: Create lib/main.dart Code
        run: |
          mkdir -p lib
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:speech_to_text/speech_to_text.dart' as stt;
          import 'package:flutter_tts/flutter_tts.dart';
          import 'package:http/http.dart' as http;
          import 'package:shared_preferences/shared_preferences.dart';
          import 'dart:convert';

          void main() {
            runApp(const MaxAiApp());
          }

          class MaxAiApp extends StatelessWidget {
            const MaxAiApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'Max AI Assistant',
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF0F172A),
                  colorScheme: const ColorScheme.dark(primary: Colors.cyan),
                ),
                home: const HomeScreen(),
              );
            }
          }

          class HomeScreen extends StatefulWidget {
            const HomeScreen({super.key});

            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }

          class _HomeScreenState extends State<HomeScreen> {
            late stt.SpeechToText _speech;
            late FlutterTts _flutterTts;
            bool _isListening = false;
            bool _isLoading = false;
            bool _standbyMode = false;
            String _userSpeech = "";
            String _aiResponse = "Tap mic or say 'Hello Power' in Standby Mode!";

            String _selectedProvider = "Gemini";
            String _geminiKey = "";
            String _chatgptKey = "";
            String _claudeKey = "";

            @override
            void initState() {
              super.initState();
              _speech = stt.SpeechToText();
              _flutterTts = FlutterTts();
              _initTts();
              _loadApiSettings();
            }

            void _initTts() async {
              await _flutterTts.setLanguage("hi-IN");
              await _flutterTts.setPitch(1.0);
              await _flutterTts.setSpeechRate(0.5);
            }

            void _loadApiSettings() async {
              SharedPreferences prefs = await SharedPreferences.getInstance();
              setState(() {
                _selectedProvider = prefs.getString('selected_provider') ?? "Gemini";
                _geminiKey = prefs.getString('gemini_api_key') ?? "";
                _chatgptKey = prefs.getString('chatgpt_api_key') ?? "";
                _claudeKey = prefs.getString('claude_api_key') ?? "";
              });
            }

            void _saveApiSettings(String provider, String gKey, String cKey, String clKey) async {
              SharedPreferences prefs = await SharedPreferences.getInstance();
              await prefs.setString('selected_provider', provider);
              await prefs.setString('gemini_api_key', gKey);
              await prefs.setString('chatgpt_api_key', cKey);
              await prefs.setString('claude_api_key', clKey);
              setState(() {
                _selectedProvider = provider;
                _geminiKey = gKey;
                _chatgptKey = cKey;
                _claudeKey = clKey;
              });
            }

            void _showSettingsDialog() {
              String tempProvider = _selectedProvider;
              TextEditingController gController = TextEditingController(text: _geminiKey);
              TextEditingController cController = TextEditingController(text: _chatgptKey);
              TextEditingController clController = TextEditingController(text: _claudeKey);

              showDialog(
                context: context,
                builder: (context) => StatefulBuilder(
                  builder: (context, setDialogState) {
                    return AlertDialog(
                      backgroundColor: const Color(0xFF1E293B),
                      title: const Text('AI Settings & Keys'),
                      content: SingleChildScrollView(
                        child: Column(
                          mainAxisSize: MainAxisSize.min,
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            const Text('Active AI Engine:', style: TextStyle(color: Colors.cyan)),
                            DropdownButton<String>(
                              value: tempProvider,
                              isExpanded: true,
                              dropdownColor: const Color(0xFF0F172A),
                              items: ['Gemini', 'ChatGPT', 'Claude']
                                  .map((e) => DropdownMenuItem(value: e, child: Text(e)))
                                  .toList(),
                              onChanged: (val) {
                                if (val != null) {
                                  setDialogState(() => tempProvider = val);
                                }
                              },
                            ),
                            const SizedBox(height: 15),
                            const Text('Google Gemini API Key:', style: TextStyle(fontSize: 12, color: Colors.grey)),
                            TextField(
                              controller: gController,
                              decoration: const InputDecoration(hintText: 'Paste Gemini Key', isDense: true),
                            ),
                            const SizedBox(height: 10),
                            const Text('OpenAI ChatGPT API Key:', style: TextStyle(fontSize: 12, color: Colors.grey)),
                            TextField(
                              controller: cController,
                              decoration: const InputDecoration(hintText: 'Paste OpenAI Key', isDense: true),
                            ),
                            const SizedBox(height: 10),
                            const Text('Anthropic Claude API Key:', style: TextStyle(fontSize: 12, color: Colors.grey)),
                            TextField(
                              controller: clController,
                              decoration: const InputDecoration(hintText: 'Paste Claude Key', isDense: true),
                            ),
                          ],
                        ),
                      ),
                      actions: [
                        TextButton(
                          onPressed: () => Navigator.pop(context),
                          child: const Text('Cancel'),
                        ),
                        ElevatedButton(
                          onPressed: () {
                            _saveApiSettings(
                              tempProvider,
                              gController.text.trim(),
                              cController.text.trim(),
                              clController.text.trim(),
                            );
                            Navigator.pop(context);
                          },
                          child: const Text('Save Settings'),
                        ),
                      ],
                    );
                  },
                ),
              );
            }

            void _toggleStandbyMode() {
              setState(() {
                _standbyMode = !_standbyMode;
              });
              if (_standbyMode) {
                _speakAndShow("Standby mode ON! Aab 'Hello Power' boliye.");
                _startContinuousListening();
              } else {
                _speech.stop();
                setState(() => _isListening = false);
                _speakAndShow("Standby mode OFF.");
              }
            }

            void _startContinuousListening() async {
              bool available = await _speech.initialize(
                onStatus: (val) {
                  if ((val == 'done' || val == 'notListening') && _standbyMode) {
                    _startContinuousListening();
                  }
                },
                onError: (val) {
                  if (_standbyMode) {
                    Future.delayed(const Duration(seconds: 1), () => _startContinuousListening());
                  }
                },
              );

              if (available) {
                setState(() => _isListening = true);
                _speech.listen(
                  onResult: (val) {
                    String recognized = val.recognizedWords.toLowerCase();
                    setState(() {
                      _userSpeech = val.recognizedWords;
                    });

                    if (recognized.contains("hello power") || recognized.contains("power")) {
                      _speech.stop();
                      _speakAndShow("Haan ji, main sun raha hu! Boliye kya madad karu?");
                      Future.delayed(const Duration(seconds: 2), () => _listenOnce());
                    } else if (!_standbyMode && recognized.isNotEmpty) {
                      _getAiResponse(val.recognizedWords);
                    }
                  },
                );
              }
            }

            void _listenOnce() async {
              bool available = await _speech.initialize(
                onStatus: (val) {
                  if (val == 'done' || val == 'notListening') {
                    setState(() => _isListening = false);
                    if (_userSpeech.isNotEmpty && !_userSpeech.toLowerCase().contains("hello power")) {
                      _getAiResponse(_userSpeech);
                    }
                  }
                },
                onError: (val) => setState(() => _isListening = false),
              );

              if (available) {
                setState(() {
                  _isListening = true;
                  _userSpeech = "";
                  _aiResponse = "Listening... Bolna shuru karein";
                });
                _speech.listen(
                  onResult: (val) => setState(() {
                    _userSpeech = val.recognizedWords;
                  }),
                );
              }
            }

            Future<void> _getAiResponse(String prompt) async {
              setState(() {
                _isLoading = true;
                _aiResponse = "Soch raha hu ($_selectedProvider)...";
              });

              try {
                if (_selectedProvider == "Gemini") {
                  if (_geminiKey.isEmpty) {
                    _speakAndShow("Settings (⚙️) me Gemini API Key daalein.");
                    return;
                  }
                  final url = Uri.parse('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$_geminiKey');
                  final res = await http.post(
                    url,
                    headers: {'Content-Type': 'application/json'},
                    body: jsonEncode({
                      "contents": [
                        {"parts": [{"text": "Short & natural Hindi answer: $prompt"}]}
                      ]
                    }),
                  );
                  if (res.statusCode == 200) {
                    final data = jsonDecode(res.body);
                    _speakAndShow(data['candidates'][0]['content']['parts'][0]['text'].toString().trim());
                  } else {
                    _speakAndShow("Gemini API Error. Key check karein.");
                  }
                } else if (_selectedProvider == "ChatGPT") {
                  if (_chatgptKey.isEmpty) {
                    _speakAndShow("Settings (⚙️) me ChatGPT API Key daalein.");
                    return;
                  }
                  final url = Uri.parse('https://api.openai.com/v1/chat/completions');
                  final res = await http.post(
                    url,
                    headers: {
                      'Content-Type': 'application/json',
                      'Authorization': 'Bearer $_chatgptKey'
                    },
                    body: jsonEncode({
                      "model": "gpt-3.5-turbo",
                      "messages": [
                        {"role": "user", "content": "Short & natural Hindi answer: $prompt"}
                      ]
                    }),
                  );
                  if (res.statusCode == 200) {
                    final data = jsonDecode(res.body);
                    _speakAndShow(data['choices'][0]['message']['content'].toString().trim());
                  } else {
                    _speakAndShow("ChatGPT API Error. Key check karein.");
                  }
                } else if (_selectedProvider == "Claude") {
                  if (_claudeKey.isEmpty) {
                    _speakAndShow("Settings (⚙️) me Claude API Key daalein.");
                    return;
                  }
                  final url = Uri.parse('https://api.anthropic.com/v1/messages');
                  final res = await http.post(
                    url,
                    headers: {
                      'Content-Type': 'application/json',
                      'x-api-key': _claudeKey,
                      'anthropic-version': '2023-06-01'
                    },
                    body: jsonEncode({
                      "model": "claude-3-haiku-20240307",
                      "max_tokens": 300,
                      "messages": [
                        {"role": "user", "content": "Short & natural Hindi answer: $prompt"}
                      ]
                    }),
                  );
                  if (res.statusCode == 200) {
                    final data = jsonDecode(res.body);
                    _speakAndShow(data['content'][0]['text'].toString().trim());
                  } else {
                    _speakAndShow("Claude API Error. Key check karein.");
                  }
                }
              } catch (e) {
                _speakAndShow("Internet connection error.");
              }
            }

            void _speakAndShow(String text) async {
              setState(() {
                _isLoading = false;
                _aiResponse = text;
              });
              await _flutterTts.stop();
              await _flutterTts.speak(text);
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: Text('MAX AI ($_selectedProvider)'),
                  centerTitle: true,
                  backgroundColor: Colors.transparent,
                  elevation: 0,
                  actions: [
                    IconButton(
                      icon: const Icon(Icons.settings, color: Colors.cyan),
                      onPressed: _showSettingsDialog,
                    )
                  ],
                ),
                body: Padding(
                  padding: const EdgeInsets.all(24.0),
                  child: Column(
                    children: [
                      Row(
                        mainAxisAlignment: MainAxisAlignment.center,
                        children: [
                          const Text("Standby Wake Mode ('Hello Power'): "),
                          Switch(
                            value: _standbyMode,
                            activeColor: Colors.cyan,
                            onChanged: (val) => _toggleStandbyMode(),
                          ),
                        ],
                      ),
                      if (_userSpeech.isNotEmpty)
                        Container(
                          padding: const EdgeInsets.all(12),
                          margin: const EdgeInsets.only(top: 8),
                          decoration: BoxDecoration(
                            color: Colors.white10,
                            borderRadius: BorderRadius.circular(12),
                          ),
                          child: Text(
                            'Aapne Kaha: "$_userSpeech"',
                            style: const TextStyle(color: Colors.cyanAccent, fontSize: 16),
                            textAlign: TextAlign.center,
                          ),
                        ),
                      const Spacer(),
                      AnimatedContainer(
                        duration: const Duration(milliseconds: 300),
                        width: 140,
                        height: 140,
                        decoration: BoxDecoration(
                          shape: BoxShape.circle,
                          color: _isListening
                              ? Colors.redAccent.withOpacity(0.2)
                              : Colors.cyan.withOpacity(0.2),
                          border: Border.all(
                            color: _isListening ? Colors.redAccent : Colors.cyan,
                            width: 3,
                          ),
                        ),
                        child: Icon(
                          _isListening ? Icons.graphic_eq : Icons.psychology,
                          size: 60,
                          color: _isListening ? Colors.redAccent : Colors.cyan,
                        ),
                      ),
                      const SizedBox(height: 30),
                      _isLoading
                          ? const CircularProgressIndicator(color: Colors.cyan)
                          : SingleChildScrollView(
                              child: Text(
                                _aiResponse,
                                style: const TextStyle(color: Colors.white, fontSize: 17, fontWeight: FontWeight.w500),
                                textAlign: TextAlign.center,
                              ),
                            ),
                      const Spacer(),
                      GestureDetector(
                        onTap: _listenOnce,
                        child: CircleAvatar(
                          radius: 40,
                          backgroundColor: _isListening ? Colors.redAccent : Colors.cyan,
                          child: Icon(
                            _isListening ? Icons.stop : Icons.mic,
                            color: Colors.white,
                            size: 36,
                          ),
                        ),
                      ),
                      const SizedBox(height: 12),
                      Text(
                        _isListening ? "Listening..." : "Tap mic or say 'Hello Power'",
                        style: const TextStyle(color: Colors.grey, fontSize: 14),
                      ),
                      const SizedBox(height: 20),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Max-AI-Assistant
          path: build/app/outputs/flutter-apk/app-release.apk
