name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Backup Manifest
        run: |
          mkdir -p temp_backup
          cp android/app/src/main/AndroidManifest.xml temp_backup/ || true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'

      - name: Clean & Re-create Android Project
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.example.max_assistant --project-name max_assistant
          if [ -f temp_backup/AndroidManifest.xml ]; then
            cp temp_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Max-AI-Assistant
          path: build/app/outputs/flutter-apk/app-release.apk
