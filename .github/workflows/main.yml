name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Recreate Android project
        run: |
          rm -rf android
          flutter create --platforms=android --project-name max_app .

      - name: Write pubspec.yaml (fixed versions)
        run: |
          rm -f pubspec.lock
          cat > pubspec.yaml <<'EOF'
          name: max_app
          description: MAX voice assistant
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.4.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            speech_to_text: ^7.0.0
            flutter_tts: ^4.2.0
            flutter_contacts: ^1.1.9
            torch_light: ^1.1.0
            android_intent_plus: ^5.3.0
            http: ^1.2.2
            shared_preferences: ^2.3.2
            image_picker: ^1.1.2
            path_provider: ^2.1.4
            permission_handler: ^11.3.1
            url_launcher: ^6.3.0

          flutter:
            uses-material-design: true
          EOF

      - name: Add permissions
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          perms = '''
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.FLASHLIGHT"/>
              <uses-permission android:name="android.permission.READ_CONTACTS"/>
              <uses-permission android:name="android.permission.CALL_PHONE"/>
              <uses-permission android:name="android.permission.READ_PHONE_STATE"/>
              <uses-permission android:name="android.permission.SET_ALARM"/>
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/>
              <queries>
                  <intent><action android:name="android.intent.action.TTS_SERVICE"/></intent>
                  <intent><action android:name="android.speech.RecognitionService"/></intent>
                  <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent>
                  <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="tel"/></intent>
                  <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="sms"/></intent>
                  <intent><action android:name="android.intent.action.DIAL"/><data android:scheme="tel"/></intent>
              </queries>
          '''
          s = s.replace('<application', perms + '<application', 1)
          open(p, 'w').write(s)
          PY

      - name: Set minSdk 24
        run: |
          f=$(ls android/app/build.gradle* | head -n 1)
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' "$f"

      - name: Get packages
        run: flutter pub get

      - name: Check Dart errors
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | grep -E "error" || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: max-apk
          if-no-files-found: error
          path: build/app/outputs/flutter-apk/app-release.apk
