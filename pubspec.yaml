name: max_ai_assistant
description: "MAX JARVIS ASSISTANT - An advanced AI voice assistant built with Flutter."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^3.8.5
  speech_to_text: ^6.6.1
  http: ^1.2.0
  permission_handler: ^11.3.0
  shared_preferences: ^2.2.3
  flutter_contacts: ^1.1.7
  torch_light: ^1.1.0
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
