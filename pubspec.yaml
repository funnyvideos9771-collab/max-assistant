name: max_ai_agent
description: A smart voice assistant Jarvis agent app.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '^3.5.0'

dependencies:
  flutter:
    sdk: flutter
  android_intent_plus: ^4.0.0
  flutter_contacts: ^1.1.7
  flutter_tts: any
  http: ^1.2.0
  installed_apps: ^2.0.0
  permission_handler: ^11.3.0
  shared_preferences: ^2.2.3
  speech_to_text: ^6.6.2
  torch_light: ^1.1.0
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
