name: jarvis_assistant
description: JARVIS Assistant (Boss) - a Gemini powered voice assistant.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_tts: ^4.2.0
  speech_to_text: ^7.0.0
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  android_intent_plus: ^5.2.0
  battery_plus: ^6.2.0
  torch_light: ^1.1.0
  webview_flutter: ^4.9.0
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
