name: max_assistant
description: MYRA - private AI voice assistant
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2
  audioplayers: ^6.1.0
  image_picker: ^1.1.2
  sensors_plus: ^6.0.1
  vibration: ^2.0.0
  camera: ^0.11.0
  path_provider: ^2.1.4
  geolocator: ^13.0.1
  url_launcher: ^6.3.0
  wakelock_plus: ^1.2.8
  permission_handler: ^11.3.1
  android_intent_plus: ^5.1.0

flutter:
  uses-material-design: true
